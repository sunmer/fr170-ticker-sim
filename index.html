<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FR170 Ticker Simulator</title>
<style>
@font-face{font-family:"Roboto Condensed";src:url("assets/RobotoCondensed.ttf");font-weight:100 900}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#202323;color:#f2f0ea;font-family:"Roboto Condensed",Arial Narrow,sans-serif}
.wrap{display:grid;justify-items:center;gap:18px}
.watch{position:relative;width:390px;height:390px;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 0 0 12px #111,0 0 0 14px #353838}
.watch *{position:absolute}
.hour,.minute{right:168px;font-size:124px;line-height:1;font-weight:700;letter-spacing:0;text-align:right}
.hour{top:57px}.minute{top:162px}.minute.accent{color:#e7283e}
.vrule{left:235px;top:72px;width:2px;height:208px;background:#5a5a5a}
.hrule{left:74px;top:291px;width:245px;height:2px;background:#5a5a5a}
.date{left:245px;top:80px;width:28px;height:86px;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:24px;font-weight:700;line-height:28px;text-align:center}
.avatar{left:282px;top:92px;width:58px;height:58px;object-fit:contain}
.battery-label{left:252px;top:174px;color:#e7283e;font-size:18px;font-weight:700}
.battery{left:252px;top:195px;font-size:30px;line-height:1;font-weight:700}
.steps-label{left:252px;top:229px;color:#e7283e;font-size:18px;font-weight:700}
.steps{left:252px;top:250px;font-size:30px;line-height:1;font-weight:700}
.newsbox{left:80px;top:313px;width:230px;height:38px;overflow:hidden}
.headline{position:absolute;left:0;top:0;white-space:nowrap;font-size:28px;line-height:38px;font-weight:700;will-change:transform}
.controls{display:flex;gap:8px}
button{width:38px;height:38px;border:1px solid #535858;border-radius:6px;background:#111;color:#f2f0ea;font-size:20px;cursor:pointer}
button[aria-pressed=true]{border-color:#e7283e}
</style>
</head>
<body>
<main class="wrap">
  <section class="watch" aria-label="Forerunner 170 390 by 390 watch face">
    <div class="hour">10</div><div class="minute">09</div>
    <div class="vrule"></div><div class="hrule"></div>
    <div class="date">TUE 18TH</div>
    <img id="avatar" class="avatar" src="assets/happy.png" alt="Energized avatar">
    <div class="battery-label">BATTERY</div><div class="battery">79%</div><div class="steps-label">STEPS</div><div class="steps">8.4K</div>
    <div class="newsbox"><div id="headline" class="headline"></div></div>
  </section>
  <div class="controls" aria-label="Avatar state">
    <button title="Energized" data-face="happy" aria-pressed="true">😊</button>
    <button title="Okay" data-face="okay">🙂</button>
    <button title="Tired" data-face="tired">😪</button>
    <button title="Stressed" data-face="stress">😮‍💨</button>
    <button id="pause" title="Pause ticker">Ⅱ</button>
  </div>
<p style="font:12px system-ui;color:#999;max-width:390px;text-align:center">Emoji: Microsoft Fluent Emoji, MIT License. Font: Roboto Condensed, OFL.</p></main>
<script>
const news=["FED HOLDS RATES AS INFLATION COOLS","EU AGREES NEW CLEAN ENERGY TARGETS","MARKETS RISE AFTER STRONG JOBS DATA"];
const el=document.getElementById("headline");let i=0,x=230,last=performance.now(),paused=false;
el.textContent=news[0];
function tick(t){const dt=(t-last)/1000;last=t;if(!paused){x-=48*dt;if(x<-el.offsetWidth){i=(i+1)%news.length;el.textContent=news[i];x=230}el.style.transform=`translateX(${x}px)`}requestAnimationFrame(tick)}
requestAnimationFrame(tick);
document.querySelectorAll("[data-face]").forEach(b=>b.onclick=()=>{document.getElementById("avatar").src=`assets/${b.dataset.face}.png`;document.getElementById("avatar").alt=b.title+" avatar";document.querySelectorAll("[data-face]").forEach(y=>y.setAttribute("aria-pressed",y===b))});
document.getElementById("pause").onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?"▶":"Ⅱ";e.currentTarget.title=paused?"Play ticker":"Pause ticker"};
</script>
</body>
</html>
